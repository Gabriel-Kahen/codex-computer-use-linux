version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /computer-use-linux/upstream
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      engine-compatible:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /computer-use-linux/codex-integration/chrome-host
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      chrome-host-compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /scripts/stock-codex
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

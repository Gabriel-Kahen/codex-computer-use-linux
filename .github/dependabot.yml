version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /computer-use-linux/upstream
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # AT-SPI crates share event types and must move together, including 0.x bumps.
      atspi-family:
        patterns: ["atspi", "atspi-*"]
        update-types: [major, minor, patch]
      engine-compatible:
        exclude-patterns: ["atspi", "atspi-*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /computer-use-linux/codex-integration/chrome-host
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      chrome-host-compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /scripts/stock-codex
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

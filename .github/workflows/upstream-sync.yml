name: upstream-sync

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  SYNC_BRANCH: automation/upstream-sync
  UPSTREAM_REPOSITORY: https://github.com/openai/codex.git

jobs:
  sync:
    if: github.repository == 'Gabriel-Kahen/codex-computer-use-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream into sync branch
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_base="$(git merge-base origin/main upstream/main)"
          # Computer-use changes are safe to merge when they do not overlap
          # paths changed by this fork. Same-path edits receive human review
          # even when Git can combine them without a textual conflict.
          git diff --name-only "$merge_base"..origin/main \
            | sort -u > "$RUNNER_TEMP/fork-files.txt"
          git diff --name-only "$merge_base"..upstream/main \
            | sort -u > "$RUNNER_TEMP/upstream-files.txt"
          comm -12 \
            "$RUNNER_TEMP/fork-files.txt" \
            "$RUNNER_TEMP/upstream-files.txt" \
            > "$RUNNER_TEMP/overlap-files.txt"
          if [[ -s "$RUNNER_TEMP/overlap-files.txt" ]]; then
            echo "overlap_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "overlap_review=false" >> "$GITHUB_OUTPUT"
          fi

          git switch -C "$SYNC_BRANCH" origin/main
          if ! git merge --no-ff --no-edit upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            {
              echo "## Upstream sync requires manual resolution"
              echo
              echo 'The merge of `openai/codex:main` into this fork has literal Git conflicts.'
              echo
              echo '```'
              echo "$conflicts"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Upstream sync has merge conflicts: ${conflicts//$'\n'/, }"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          remote_ref="refs/remotes/origin/$SYNC_BRANCH"
          if git ls-remote --exit-code --heads origin "refs/heads/$SYNC_BRANCH" >/dev/null; then
            git fetch origin "$SYNC_BRANCH:$remote_ref"
            lease="$(git rev-parse "$remote_ref")"
            git push \
              --force-with-lease="refs/heads/$SYNC_BRANCH:$lease" \
              origin "HEAD:refs/heads/$SYNC_BRANCH"
          else
            git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi

      - name: Open pull request and run computer-use CI
        id: pull_request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$GITHUB_REPOSITORY_OWNER:$SYNC_BRANCH"
          pr_body='Automated merge of the latest `openai/codex:main` into the Linux computer-use fork. Literal merge conflicts stop the workflow. Clean merges auto-merge after fork CI unless upstream and the fork changed the same paths, which requires manual review.'
          pr="$(gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f base=main \
            -f head="$head" \
            --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            pr="$(gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f base=main \
              -f head="$head" \
              -f title='Merge upstream openai/codex main' \
              -f body="$pr_body" \
              --jq .number)"
          else
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$pr" \
              -f body="$pr_body" \
              >/dev/null
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

          # Events created with GITHUB_TOKEN do not recursively start normal PR
          # workflows. workflow_dispatch is allowed, so explicitly run the
          # required fork-owned check on the sync branch.
          gh workflow run computer-use-ci.yml --ref "$SYNC_BRANCH"

      - name: Require review for overlapping fork and upstream changes
        if: >-
          steps.merge.outputs.changed == 'true' &&
          steps.merge.outputs.overlap_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pull_request.outputs.number }}
        run: |
          set -euo pipefail
          label="upstream-fork-overlap"
          if gh api "repos/$GITHUB_REPOSITORY/labels/$label" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/labels/$label" \
              -f color=B60205 \
              -f description='Upstream and the fork changed the same paths' \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/labels" \
              -f name="$label" \
              -f color=B60205 \
              -f description='Upstream and the fork changed the same paths' \
              >/dev/null
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels" \
            -f "labels[]=$label" \
            >/dev/null
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels/upstream-computer-use-review" \
            --silent || true

          marker='<!-- upstream-sync-overlap -->'
          paths="$(sed 's/^/- `/' "$RUNNER_TEMP/overlap-files.txt" | sed 's/$/`/')"
          body="${marker}
          Upstream and this fork both changed the paths below. Git merged them without textual conflicts and fork CI was dispatched, but automatic merging is disabled because the combined behavior needs manual review:

          ${paths}"
          comment_id="$(gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
            | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -f body="$body" \
              >/dev/null
          fi

      - name: Merge non-overlapping upstream changes after CI
        if: >-
          steps.merge.outputs.changed == 'true' &&
          steps.merge.outputs.overlap_review != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pull_request.outputs.number }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels/upstream-fork-overlap" \
            --silent || true
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels/upstream-computer-use-review" \
            --silent || true

          head_sha="$(git rev-parse HEAD)"
          run=""
          for _ in {1..15}; do
            run="$(gh run list \
              --workflow computer-use-ci.yml \
              --branch "$SYNC_BRANCH" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" \
              | head -n 1)"
            [[ -n "$run" ]] && break
            sleep 2
          done
          if [[ -z "$run" ]]; then
            echo "Could not find the dispatched computer-use CI run for $head_sha" >&2
            exit 1
          fi

          gh run watch "$run" --exit-status
          run_url="$(gh run view "$run" --json url --jq .url)"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=success \
            -f context='Computer use CI' \
            -f description='Fork computer-use tests passed' \
            -f target_url="$run_url" \
            >/dev/null
          merged="$(gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" \
            -f merge_method=merge \
            -f sha="$head_sha" \
            --jq .merged)"
          [[ "$merged" == true ]]
          if git ls-remote --exit-code --heads origin "refs/heads/$SYNC_BRANCH" >/dev/null; then
            git push origin --delete "$SYNC_BRANCH"
          fi

name: upstream-sync

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  SYNC_BRANCH: automation/upstream-sync
  UPSTREAM_REPOSITORY: https://github.com/openai/codex.git

jobs:
  sync:
    if: github.repository == 'Gabriel-Kahen/codex-computer-use-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main
          # GITHUB_TOKEN cannot push upstream changes under .github/workflows.
          # Use a write-enabled deploy key scoped to this repository for Git transport.
          ssh-key: ${{ secrets.UPSTREAM_SYNC_DEPLOY_KEY }}

      - name: Merge upstream into sync branch
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main
          git config rerere.enabled true
          git config rerere.autoupdate true

          # Teach Git the conflict resolutions from recent reviewed upstream
          # merge commits. Work in a disposable clone because training checks
          # out and resets each historical merge while learning it.
          mapfile -t resolution_merges < <(
            git log origin/main \
              --merges \
              --max-count=25 \
              --format=%H \
              --grep="Merge remote-tracking branch '.*upstream/main' into"
          )
          if (( ${#resolution_merges[@]} > 0 )); then
            training_repo="$RUNNER_TEMP/upstream-rerere-training"
            git clone --shared --quiet . "$training_repo"
            (
              cd "$training_repo"
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git config rerere.enabled true
              for merge_commit in "${resolution_merges[@]}"; do
                read -ra parents <<< "$(git show -s --format=%P "$merge_commit")"
                git checkout -q "${parents[0]}"
                if git merge --no-gpg-sign "${parents[@]:1}" >/dev/null 2>&1; then
                  continue
                fi
                if [[ -s "$(git rev-parse --git-dir)/MERGE_RR" ]]; then
                  git rerere
                  git checkout -q "$merge_commit" -- .
                  git rerere
                fi
                git reset -q --hard
              done
            )
            if [[ -d "$training_repo/.git/rr-cache" ]]; then
              mkdir -p "$(git rev-parse --git-dir)/rr-cache"
              cp -R \
                "$training_repo/.git/rr-cache/." \
                "$(git rev-parse --git-dir)/rr-cache/"
            fi
          fi

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "reused_resolution=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_base="$(git merge-base origin/main upstream/main)"
          # Computer-use changes are safe to merge when they do not overlap
          # paths changed by this fork. Same-path edits receive human review
          # even when Git can combine them without a textual conflict.
          git diff --name-only "$merge_base"..origin/main \
            | sort -u > "$RUNNER_TEMP/fork-files.txt"
          git diff --name-only "$merge_base"..upstream/main \
            | sort -u > "$RUNNER_TEMP/upstream-files.txt"
          comm -12 \
            "$RUNNER_TEMP/fork-files.txt" \
            "$RUNNER_TEMP/upstream-files.txt" \
            > "$RUNNER_TEMP/overlap-files.txt"
          if [[ -s "$RUNNER_TEMP/overlap-files.txt" ]]; then
            echo "overlap_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "overlap_review=false" >> "$GITHUB_OUTPUT"
          fi

          git switch -C "$SYNC_BRANCH" origin/main
          if ! git merge --no-ff --no-edit upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -z "$conflicts" ]]; then
              git commit --no-edit
              {
                echo "## Reused reviewed upstream conflict resolutions"
                echo
                echo "Git rerere resolved every conflict using prior reviewed upstream merges."
                echo "The resulting pull request still requires overlap review and fork CI."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "conflict=false" >> "$GITHUB_OUTPUT"
              echo "reused_resolution=true" >> "$GITHUB_OUTPUT"
              echo "overlap_review=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            merge_rr="$(git rev-parse --git-dir)/MERGE_RR"
            if [[ -s "$merge_rr" ]]; then
              conflict_fingerprint="$(
                tr '\0' '\n' < "$merge_rr" \
                  | LC_ALL=C sort \
                  | git hash-object --stdin
              )"
            else
              conflict_fingerprint="$(git ls-files -u -z | git hash-object --stdin)"
            fi
            printf '%s\n' "$conflict_fingerprint" > "$RUNNER_TEMP/upstream-sync-conflict-state"
            git merge --abort
            {
              echo "## Upstream sync requires manual resolution"
              echo
              echo 'The merge of `openai/codex:main` into this fork has literal Git conflicts.'
              echo
              echo '```'
              echo "$conflicts"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "conflict_fingerprint=$conflict_fingerprint" >> "$GITHUB_OUTPUT"
            echo "conflicts=${conflicts//$'\n'/, }" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "reused_resolution=false" >> "$GITHUB_OUTPUT"

      - name: Check whether conflict state is new
        id: conflict_cache
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/upstream-sync-conflict-state
          key: upstream-sync-conflict-${{ steps.merge.outputs.conflict_fingerprint }}
          lookup-only: true

      - name: Remember new conflict state
        if: >-
          steps.merge.outputs.conflict == 'true' &&
          steps.conflict_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/upstream-sync-conflict-state
          key: upstream-sync-conflict-${{ steps.merge.outputs.conflict_fingerprint }}

      - name: Report or suppress merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          CACHE_HIT: ${{ steps.conflict_cache.outputs.cache-hit }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          action="$(python3 .github/scripts/upstream_sync_conflict_policy.py \
            "$EVENT_NAME" "$CACHE_HIT")"
          if [[ "$action" == report ]]; then
            echo "::error::Upstream sync has merge conflicts: $CONFLICTS"
            exit 1
          fi
          echo "::warning::Upstream sync still has previously reported merge conflicts: $CONFLICTS"

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          remote_ref="refs/remotes/origin/$SYNC_BRANCH"
          if git ls-remote --exit-code --heads origin "refs/heads/$SYNC_BRANCH" >/dev/null; then
            git fetch origin "$SYNC_BRANCH:$remote_ref"
            lease="$(git rev-parse "$remote_ref")"
            git push \
              --force-with-lease="refs/heads/$SYNC_BRANCH:$lease" \
              origin "HEAD:refs/heads/$SYNC_BRANCH"
          else
            git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi

      - name: Open pull request and run computer-use CI
        id: pull_request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED_RESOLUTION: ${{ steps.merge.outputs.reused_resolution }}
        run: |
          set -euo pipefail
          head="$GITHUB_REPOSITORY_OWNER:$SYNC_BRANCH"
          pr_body='Automated merge of the latest `openai/codex:main` into the Linux computer-use fork. Unknown merge conflicts stop the workflow. Clean merges auto-merge after fork CI unless upstream and the fork changed the same paths, which requires manual review.'
          if [[ "$REUSED_RESOLUTION" == true ]]; then
            pr_body="$pr_body

          Git reused conflict resolutions from prior reviewed upstream merges. Automatic merging is disabled; review the reused resolution and fork CI before merging."
          fi
          pr="$(gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f base=main \
            -f head="$head" \
            --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            pr="$(gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f base=main \
              -f head="$head" \
              -f title='Merge upstream openai/codex main' \
              -f body="$pr_body" \
              --jq .number)"
          else
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$pr" \
              -f body="$pr_body" \
              >/dev/null
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

          # Events created with GITHUB_TOKEN do not recursively start normal PR
          # workflows. workflow_dispatch is allowed, so explicitly run the
          # required fork-owned check on the sync branch.
          gh workflow run computer-use-ci.yml --ref "$SYNC_BRANCH"

      - name: Require review for overlapping fork and upstream changes
        if: >-
          steps.merge.outputs.changed == 'true' &&
          (steps.merge.outputs.overlap_review == 'true' ||
          steps.merge.outputs.reused_resolution == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pull_request.outputs.number }}
          REUSED_RESOLUTION: ${{ steps.merge.outputs.reused_resolution }}
        run: |
          set -euo pipefail
          label="upstream-fork-overlap"
          if gh api "repos/$GITHUB_REPOSITORY/labels/$label" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/labels/$label" \
              -f color=B60205 \
              -f description='Upstream and the fork changed the same paths' \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/labels" \
              -f name="$label" \
              -f color=B60205 \
              -f description='Upstream and the fork changed the same paths' \
              >/dev/null
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels" \
            -f "labels[]=$label" \
            >/dev/null
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels/upstream-computer-use-review" \
            --silent || true

          marker='<!-- upstream-sync-overlap -->'
          paths="$(sed 's/^/- `/' "$RUNNER_TEMP/overlap-files.txt" | sed 's/$/`/')"
          body="${marker}
          Upstream and this fork both changed the paths below. Git merged them without textual conflicts and fork CI was dispatched, but automatic merging is disabled because the combined behavior needs manual review:

          ${paths}"
          if [[ "$REUSED_RESOLUTION" == true ]]; then
            body="${marker}
          Git reused previously reviewed resolutions for textual conflicts in this upstream merge. Fork CI was dispatched, but automatic merging is disabled so the replayed resolution can be reviewed.

          Overlapping paths:

          ${paths}"
          fi
          comment_ids="$(gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id")"
          comment_id="${comment_ids%%$'\n'*}"
          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -f body="$body" \
              >/dev/null
          fi

      - name: Merge non-overlapping upstream changes after CI
        if: >-
          steps.merge.outputs.changed == 'true' &&
          steps.merge.outputs.overlap_review != 'true' &&
          steps.merge.outputs.reused_resolution != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pull_request.outputs.number }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels/upstream-fork-overlap" \
            --silent || true
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels/upstream-computer-use-review" \
            --silent || true

          head_sha="$(git rev-parse HEAD)"
          run=""
          for _ in {1..15}; do
            run="$(gh run list \
              --workflow computer-use-ci.yml \
              --branch "$SYNC_BRANCH" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" \
              | head -n 1)"
            [[ -n "$run" ]] && break
            sleep 2
          done
          if [[ -z "$run" ]]; then
            echo "Could not find the dispatched computer-use CI run for $head_sha" >&2
            exit 1
          fi

          gh run watch "$run" --exit-status
          run_url="$(gh run view "$run" --json url --jq .url)"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=success \
            -f context='Computer use CI' \
            -f description='Fork computer-use tests passed' \
            -f target_url="$run_url" \
            >/dev/null
          merged="$(gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" \
            -f merge_method=merge \
            -f sha="$head_sha" \
            --jq .merged)"
          [[ "$merged" == true ]]
          if git ls-remote --exit-code --heads origin "refs/heads/$SYNC_BRANCH" >/dev/null; then
            git push origin --delete "$SYNC_BRANCH"
          fi

name: upstream-sync

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  SYNC_BRANCH: automation/upstream-sync
  UPSTREAM_REPOSITORY: https://github.com/openai/codex.git

jobs:
  sync:
    if: github.repository == 'Gabriel-Kahen/codex-computer-use-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream into sync branch
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_base="$(git merge-base origin/main upstream/main)"
          git diff --name-only "$merge_base"..upstream/main > "$RUNNER_TEMP/upstream-files.txt"
          git diff --unified=0 "$merge_base"..upstream/main > "$RUNNER_TEMP/upstream.patch"
          if grep -Eiq 'computer[ _-]?use' \
            "$RUNNER_TEMP/upstream-files.txt" \
            "$RUNNER_TEMP/upstream.patch"; then
            echo "computer_use_review=true" >> "$GITHUB_OUTPUT"
            {
              grep -Ei 'computer[ _-]?use' "$RUNNER_TEMP/upstream-files.txt" || true
              git diff \
                --name-only \
                -G'[Cc]omputer[ _-]?[Uu]se|COMPUTER[ _-]?USE' \
                "$merge_base"..upstream/main
            } | sort -u > "$RUNNER_TEMP/computer-use-review-files.txt"
          else
            echo "computer_use_review=false" >> "$GITHUB_OUTPUT"
          fi

          git switch -C "$SYNC_BRANCH" origin/main
          if ! git merge --no-ff --no-edit upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            title="Upstream Codex sync requires manual resolution"
            body="The scheduled merge of \`openai/codex:main\` into this fork conflicted.\n\nConflicted paths:\n\n\`\`\`\n${conflicts}\n\`\`\`\n\nRun the upstream-sync workflow again after resolving the conflict."
            issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          remote_ref="refs/remotes/origin/$SYNC_BRANCH"
          if git ls-remote --exit-code --heads origin "refs/heads/$SYNC_BRANCH" >/dev/null; then
            git fetch origin "$SYNC_BRANCH:$remote_ref"
            lease="$(git rev-parse "$remote_ref")"
            git push \
              --force-with-lease="refs/heads/$SYNC_BRANCH:$lease" \
              origin "HEAD:refs/heads/$SYNC_BRANCH"
          else
            git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi

      - name: Open pull request and run computer-use CI
        id: pull_request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$GITHUB_REPOSITORY_OWNER:$SYNC_BRANCH"
          pr="$(gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f base=main \
            -f head="$head" \
            --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            pr="$(gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f base=main \
              -f head="$head" \
              -f title='Merge upstream openai/codex main' \
              -f body='Automated merge of the latest `openai/codex:main` into the Linux computer-use fork. Literal merge conflicts stop the workflow. Upstream changes involving computer use require manual review and cannot auto-merge.' \
              --jq .number)"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

          # Events created with GITHUB_TOKEN do not recursively start normal PR
          # workflows. workflow_dispatch is allowed, so explicitly run the
          # required fork-owned check on the sync branch.
          gh workflow run computer-use-ci.yml --ref "$SYNC_BRANCH"

      - name: Require review for upstream computer-use changes
        if: >-
          steps.merge.outputs.changed == 'true' &&
          steps.merge.outputs.computer_use_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pull_request.outputs.number }}
        run: |
          set -euo pipefail
          label="upstream-computer-use-review"
          if gh api "repos/$GITHUB_REPOSITORY/labels/$label" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/labels/$label" \
              -f color=B60205 \
              -f description='Upstream computer-use changes require manual review' \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/labels" \
              -f name="$label" \
              -f color=B60205 \
              -f description='Upstream computer-use changes require manual review' \
              >/dev/null
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels" \
            -f "labels[]=$label" \
            >/dev/null

          paths="$(sed 's/^/- `/' "$RUNNER_TEMP/computer-use-review-files.txt" | sed 's/$/`/')"
          body="Upstream changed computer-use-related code or text, so automatic merging is disabled. Review these paths and preserve the fork's Linux implementation before merging:

          ${paths}"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -f body="$body" \
            >/dev/null

      - name: Merge unrelated upstream changes after CI
        if: >-
          steps.merge.outputs.changed == 'true' &&
          steps.merge.outputs.computer_use_review != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pull_request.outputs.number }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels/upstream-computer-use-review" \
            --silent || true

          head_sha="$(git rev-parse HEAD)"
          run=""
          for _ in {1..15}; do
            run="$(gh run list \
              --workflow computer-use-ci.yml \
              --branch "$SYNC_BRANCH" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" \
              | head -n 1)"
            [[ -n "$run" ]] && break
            sleep 2
          done
          if [[ -z "$run" ]]; then
            echo "Could not find the dispatched computer-use CI run for $head_sha" >&2
            exit 1
          fi

          gh run watch "$run" --exit-status
          merged="$(gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" \
            -f merge_method=merge \
            -f sha="$head_sha" \
            --jq .merged)"
          [[ "$merged" == true ]]

name: hyprland-native-e2e

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact candidate revision to validate
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: hyprland-native-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-e2e:
    name: Real Hyprland capture and input
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure Hyprland binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: hyprland
          skipPush: true

      - name: Run compositor-in-the-loop smoke test
        run: |
          nix build \
            --file contrib/hyprland-background-computer-use/tests/native-e2e.nix \
            --print-build-logs \
            --extra-substituters https://hyprland.cachix.org

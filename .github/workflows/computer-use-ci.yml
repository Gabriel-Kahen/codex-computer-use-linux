name: computer-use-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-use-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-sync:
    name: Codex sync integration
    if: >-
      (github.event_name == 'pull_request' &&
        (github.head_ref == 'automation/upstream-sync' || startsWith(github.head_ref, 'codex/upstream-sync-'))) ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref_name == 'automation/upstream-sync' || startsWith(github.ref_name, 'codex/upstream-sync-')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Test sync conflict resolutions
        run: |
          just test -p codex-protocol
          just test -p codex-utils-output-truncation
          just test -p codex-core -E 'test(for_prompt_strips_media_when_model_does_not_support_it) | test(record_items_preserves_supported_audio_tool_output) | test(record_items_hard_caps_oversized_audio_tool_output) | test(audio_data_url_payload_uses_decoded_audio_estimate) | test(for_prompt_removes_pairs_with_oversized_output_envelopes)'

      - name: Test upstream conflict notification policy
        working-directory: .
        run: python3 .github/scripts/tests/test_upstream_sync_conflict_policy.py -v

  linux-backend:
    name: Linux backend and plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config

      - name: Validate plugin and provenance
        run: |
          computer-use-linux/scripts/validate_plugin.py
          python3 -m unittest discover \
            -s computer-use-linux/scripts/tests \
            -p 'test_*.py' \
            -v

      - name: Check backend formatting and lints
        run: |
          cargo fmt --manifest-path computer-use-linux/upstream/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path computer-use-linux/upstream/Cargo.toml --all-targets -- -D warnings

      - name: Test backend and MCP contract
        run: |
          cargo test --locked --manifest-path computer-use-linux/upstream/Cargo.toml --all-targets
          cargo build --locked --manifest-path computer-use-linux/upstream/Cargo.toml --bin computer-use-linux
          python3 computer-use-linux/upstream/scripts/mcp_safety_check.py \
            --repo computer-use-linux/upstream \
            --binary computer-use-linux/upstream/target/debug/computer-use-linux

      - name: Test isolated Codex Chrome integration
        run: |
          cargo fmt --manifest-path computer-use-linux/codex-integration/chrome-host/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path computer-use-linux/codex-integration/chrome-host/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path computer-use-linux/codex-integration/chrome-host/Cargo.toml

  computer-use:
    name: Computer use CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compile and test Hyprland computer use
        env:
          PYTHONPATH: contrib/hyprland-background-computer-use/src
        run: |
          python3 -m compileall -q \
            contrib/hyprland-background-computer-use/src \
            contrib/hyprland-background-computer-use/tests \
            contrib/hyprland-background-computer-use/bin
          python3 -m unittest discover \
            -s contrib/hyprland-background-computer-use/tests \
            -p 'test_*.py' \
            -v

      - name: Compile and test GNOME computer use
        env:
          PYTHONPATH: contrib/gnome-same-session-computer-use/src
        run: |
          python3 -m compileall -q \
            contrib/gnome-same-session-computer-use/src \
            contrib/gnome-same-session-computer-use/tests \
            contrib/gnome-same-session-computer-use/bin
          python3 -m unittest discover \
            -s contrib/gnome-same-session-computer-use/tests \
            -p 'test_*.py' \
            -v

      - name: Validate GNOME plugin manifests and Shell syntax
        run: |
          python3 -m json.tool contrib/gnome-same-session-computer-use/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool contrib/gnome-same-session-computer-use/.mcp.json >/dev/null
          python3 -m json.tool contrib/gnome-same-session-computer-use/gnome-shell/background-computer-use@openai.com/metadata.json >/dev/null
          python3 -m json.tool contrib/gnome-same-session-computer-use/gnome-shell/background-computer-use@openai.com/package.json >/dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("contrib/gnome-same-session-computer-use")
          manifest = json.loads((root / ".codex-plugin/plugin.json").read_text())
          mcp = json.loads((root / manifest["mcpServers"]).read_text())
          assert root.name == manifest["name"]
          command = root / mcp["mcpServers"][manifest["name"]]["command"]
          assert command.is_file() and os.access(command, os.X_OK)
          PY
          node --check contrib/gnome-same-session-computer-use/gnome-shell/background-computer-use@openai.com/lease_protocol.js
          node --check contrib/gnome-same-session-computer-use/gnome-shell/background-computer-use@openai.com/shell_transactions.js
          node --check contrib/gnome-same-session-computer-use/gnome-shell/background-computer-use@openai.com/extension.js
          node --test \
            contrib/gnome-same-session-computer-use/tests/test_lease_protocol.mjs \
            contrib/gnome-same-session-computer-use/tests/test_shell_transactions.mjs

      - name: Install X11 and Plasma computer use build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            dbus \
            g++ \
            libpng-dev \
            libx11-dev \
            libxcomposite-dev \
            libxres-dev \
            openbox \
            pkg-config \
            qt6-base-dev \
            x11-utils \
            xcompmgr \
            xdotool \
            xvfb

      - name: Compile and test X11 computer use
        env:
          PYTHONPATH: contrib/x11-background-computer-use/src
        run: |
          python3 -m compileall -q \
            contrib/x11-background-computer-use/src \
            contrib/x11-background-computer-use/tests \
            contrib/x11-background-computer-use/bin
          cc -O2 -Wall -Wextra -Werror \
            -o /tmp/x11-window-capture \
            contrib/x11-background-computer-use/x11/x11-window-capture.c \
            $(pkg-config --cflags --libs x11 xcomposite xres libpng)
          python3 -m unittest discover \
            -s contrib/x11-background-computer-use/tests \
            -p 'test_*.py' \
            -v
          contrib/x11-background-computer-use/tests/native_smoke.sh \
            /tmp/x11-window-capture

      - name: Compile and test Plasma computer use
        env:
          PYTHONPATH: contrib/plasma-same-session-computer-use/src
        run: |
          python3 -m compileall -q \
            contrib/plasma-same-session-computer-use/src \
            contrib/plasma-same-session-computer-use/tests \
            contrib/plasma-same-session-computer-use/bin
          python3 -m json.tool \
            contrib/plasma-same-session-computer-use/.codex-plugin/plugin.json \
            >/dev/null
          python3 -m json.tool \
            contrib/plasma-same-session-computer-use/.mcp.json \
            >/dev/null
          python3 -m unittest discover \
            -s contrib/plasma-same-session-computer-use/tests \
            -p 'test_*.py' \
            -v
          c++ -fPIC -Wall -Wextra -Wpedantic -std=c++17 \
            contrib/plasma-same-session-computer-use/kwin/capture-helper.cpp \
            -o /tmp/plasma-same-session-capture-test \
            $(pkg-config --cflags --libs Qt6Core Qt6Gui Qt6DBus)

name: computer-use-upstream-sync

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-use-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Gabriel-Kahen/codex-computer-use-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      revision: ${{ steps.candidate.outputs.revision }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Prepare three-way upstream merge
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine-update-diagnostics"
          python3 -m unittest discover -s computer-use-linux/scripts/tests -p 'test_*.py' -v
          python3 computer-use-linux/scripts/sync_upstream.py prepare 2>&1 | tee "$RUNNER_TEMP/engine-update-diagnostics/prepare.log"
          if [[ -z "$(git status --porcelain -- computer-use-linux)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save merge diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/engine-update-diagnostics"
          git diff -- computer-use-linux > "$RUNNER_TEMP/engine-update-diagnostics/candidate.patch"
          git status --short > "$RUNNER_TEMP/engine-update-diagnostics/status.txt"

      - name: Upload merge diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-update-diagnostics
          path: ${{ runner.temp }}/engine-update-diagnostics/
          retention-days: 14

      - name: Stage candidate for complete verification
        if: steps.sync.outputs.changed == 'true'
        id: candidate
        env:
          CANDIDATE_BRANCH: automation/engine-upstream-candidate
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$CANDIDATE_BRANCH"
          git add computer-use-linux
          git commit -m 'chore(engine): update pinned agent-sh upstream'
          lease="$(git ls-remote --heads origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)"
          git push --force-with-lease="refs/heads/$CANDIDATE_BRANCH:$lease" origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          revision="$(git rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Candidate revision: $revision" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/computer-use-ci.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}

  verify-hyprland:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/hyprland-native-e2e.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}

  verify-stock-codex:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/stock-codex-compat.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}

  publish:
    needs: [prepare, verify, verify-hyprland, verify-stock-codex]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      SYNC_BRANCH: automation/engine-upstream-sync
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout verified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Open or update draft review PR
        env:
          VERIFIED_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          lease="$(git ls-remote --heads origin "refs/heads/$SYNC_BRANCH" | cut -f1)"
          git push --force-with-lease="refs/heads/$SYNC_BRANCH:$lease" origin "HEAD:refs/heads/$SYNC_BRANCH"
          cat > "$RUNNER_TEMP/upstream-pr.md" <<'EOF'
          Updates the pinned `agent-sh/computer-use-linux` engine using a three-way merge that retains this project's local patches.

          The candidate passed backend formatting, Clippy, tests, MCP contract checks, desktop companion tests, native X11/Plasma checks, the real Hyprland VM test, and stock Codex compatibility. These checks run explicitly before publication because PRs created with `GITHUB_TOKEN` do not trigger pull-request workflows.

          Review the local patch behavior and `computer-use-linux/UPSTREAM.toml`. This update is never merged automatically.
          EOF
          printf '\nVerified commit: `%s`\n\n[Validation run](%s/%s/actions/runs/%s).\n' "$VERIFIED_REVISION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/upstream-pr.md"
          pr="$(gh pr list --state open --head "$SYNC_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            gh pr create --draft --base main --head "$SYNC_BRANCH" \
              --title 'chore(engine): update pinned agent-sh upstream' --body-file "$RUNNER_TEMP/upstream-pr.md"
          else
            if [[ "$(gh pr view "$pr" --json isDraft --jq .isDraft)" == "false" ]]; then
              gh pr ready "$pr" --undo
            fi
            gh pr edit "$pr" --title 'chore(engine): update pinned agent-sh upstream' --body-file "$RUNNER_TEMP/upstream-pr.md"
          fi

      - name: Dispatch checks on the PR commit
        run: |
          # Reusable verification above attaches checks to the caller's main SHA.
          # Explicit dispatch attaches required checks to the actual PR branch.
          gh workflow run computer-use-ci.yml --ref "$SYNC_BRANCH"
          gh workflow run hyprland-native-e2e.yml --ref "$SYNC_BRANCH"
          gh workflow run stock-codex-compat.yml --ref "$SYNC_BRANCH"

  report-health:
    needs: [prepare, verify, verify-hyprland, verify-stock-codex, publish]
    if: always() && github.repository == 'Gabriel-Kahen/codex-computer-use-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout maintenance reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Report failure or close recovered issue
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_JOB_RESULTS: ${{ toJSON(needs) }}
          UPDATE_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: python3 scripts/report_upstream_health.py --failed "$UPDATE_FAILED"

[package]
name = "codex-chrome-extension-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Codex-specific Linux Chrome native-messaging and app-server bridge"
publish = false

[[bin]]
name = "codex-chrome-extension-host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
futures-util = "0.3.32"
getrandom = "0.4.2"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.51.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
